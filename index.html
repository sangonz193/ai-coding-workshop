<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code is solved, engineering is not</title>
  </head>
  <body class="audience">
    <div id="stage" class="stage" role="img" aria-label="A miniature room of desks with laptops, monitors and phones showing each part of the story."></div>
    <main class="caption" aria-live="polite">
      <p class="chapter" id="chapter"></p>
      <h1 id="title"></h1>
      <p id="text"></p>
    </main>
    <section class="join" aria-label="Join the live presentation">
      <h2 class="join-title">Code is solved, engineering is not.</h2>
      <p class="join-hint">Scan to follow along on your phone</p>
      <div id="join-code" class="join-code" role="img" aria-label="QR code to open this presentation"></div>
      <p class="join-url" id="join-url"></p>
      <p class="joined">You’re in. The talk follows the speaker on this screen.</p>
    </section>
    <nav class="controls" aria-label="Presentation">
      <p class="status" id="status" role="status"></p>
      <button id="prev" aria-label="Previous">←</button>
      <select id="chapters" aria-label="Chapter"></select>
      <button id="next" aria-label="Next">→</button>
      <button id="follow"></button>
    </nav>
    <script type="module" src="/src/audience.ts"></script>
  </body>
</html>
