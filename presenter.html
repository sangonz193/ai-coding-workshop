<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Presenter · Code is solved, engineering is not</title>
  </head>
  <body class="presenter">
    <div class="layout">
      <div id="stage" class="stage" aria-hidden="true"></div>
      <main class="desk">
        <p class="chapter" id="chapter"></p>
        <h1 id="title"></h1>
        <p id="text" class="current"></p>
        <form id="signin" class="controls" hidden>
          <input id="email" type="email" aria-label="Email" placeholder="Email" autocomplete="username" required />
          <input id="password" type="password" aria-label="Password" placeholder="Password" autocomplete="current-password" required />
          <button>Sign in to drive the audience</button>
          <p id="signin-error" class="counter" role="alert"></p>
        </form>
        <nav class="controls" aria-label="Presenter controls">
          <button id="prev">Previous</button>
          <button id="next">Next</button>
          <select id="chapters" aria-label="Jump to chapter"></select>
          <button id="qr" aria-pressed="false">Show join code</button>
        </nav>
        <p id="counter" class="counter"></p>
        <div id="pace" class="pace" hidden>
          <p><span id="pace-time"></span> · <strong id="pace-drift"></strong></p>
          <div class="pace-bar" role="presentation"><span id="pace-fill"></span></div>
          <p id="pace-step" class="counter"></p>
        </div>
        <h2>Speaker notes</h2>
        <p id="notes" class="notes"></p>
        <h2>Up next</h2>
        <p id="upcoming"></p>
        <h2>Prepared answers</h2>
        <div id="answers" class="answers"></div>
        <p class="counter">Arrow keys, Space, or Page Up/Down move through reveals; Q shows or hides the join code. The audience view is at <a href="/">/</a>.</p>
      </main>
    </div>
    <script type="module" src="/src/presenter.ts"></script>
  </body>
</html>
